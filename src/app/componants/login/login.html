<section class="loginForm">
        <div class="w-100 m-0 row justify-content-between align-items-center position-relative">
          <div class="boxform col-md-6 col-sm-12 p-5 d-flex justify-content-center align-items-center flex-column">
            <h1 class=" titleForm mainfont">اهلا بعودتك</h1>
            <p>سجل دخولك</p>
          <form class="text-center" [formGroup]="loginForm" (ngSubmit)="submitForm()" >
           <div class="field mb-5 w-100 position-relative">
            <i class="fa-solid fa-envelope position-absolute"></i>
            <input class="w-100" type="email" formControlName="Email" placeholder="">
            <label class="position-absolute">Email</label>
            @if ( submited && loginForm.controls.Email.errors?.['required']) {
             <small class="note text-start text-danger fs-6">الايميل مطلوب*</small>
            }
           </div>
           <div class="field w-100 mb-4 position-relative">
             <i class="fa-solid fa-lock position-absolute"></i>            
             <input dir="ltr" class="w-100" type="password" formControlName="Password" placeholder="">
             <label class="position-absolute">Password</label>
             @if ( submited && loginForm.controls.Password.errors?.['required']) {
             <small class="note text-start text-danger fs-6">الباسوورد مطلوب*</small>
             }
           </div>
          <button type="submit" class="submitBtn mb-3 w-100">تسجيل الدخول</button>
           <div class="return d-flex justify-content-center align-items-center flex-wrap gap-2">
            <p class="m-0">الرجوع لصفحة الزائر:</p>
            <a routerLink="/">صفحة الزائر</a>
           </div>
         </form>
          </div>
          <div class="imge col-6 d-md-block d-sm-none"></div>
        </div>
        @if (showMassege) {
            <app-masseges  [messageData]="massegeresult!"></app-masseges>
        }
</section>
