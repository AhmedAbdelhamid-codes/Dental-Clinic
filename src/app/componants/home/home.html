<section  class="hero position-relative vh-100 d-flex align-items-center">
    <div class="hero__lines"></div>
    <div class="container d-flex gap-4 justify-content-start text-start">
        <div class="social position-relative d-flex flex-column align-items-center gap-3">
            <h2 class="titleSocial">{{'hero.followUs' | translate}}</h2>
            <a href="" class="socialLinks social1 link-underline link-underline-opacity-0"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="" class="socialLinks social2 link-underline link-underline-opacity-0"><i class="fa-brands fa-instagram"></i></a>
            <a href="" class="socialLinks social3 link-underline link-underline-opacity-0"><i class="fa-solid fa-location-dot"></i></a>
            <a href="" class="socialLinks social4 link-underline link-underline-opacity-0"><i class="fa-brands fa-whatsapp"></i></a>
        </div>
        <div class="details ms-2 text-start">
           <h1 class="title mb-3">{{'hero.title' | translate}}<span class="subtitle ms-sm-5 ms-0 d-block text-start">{{'hero.subtitle' | translate}}</span></h1>
           <p class="paragraph mb-4">{{'hero.description' | translate}}<br>{{'hero.description2' | translate}}</p>
           <div class="btns d-flex justify-content-start align-items-center gap-3 flex-wrap">
             <a routerLink="/booking" class="mainBtn link-underline link-underline-opacity-0"><i class="fa-solid fa-calendar-days"></i>{{'hero.bookNow' | translate}}</a>
             <a routerLink="/about" class="ghostBtn link-underline link-underline-opacity-0"><i class="fa-regular fa-user me-1"></i>{{'hero.aboutDoctor' | translate}}</a>
           </div>
        </div>
    <div class="hero-scroll position-absolute d-flex justify-content-center  flex-column ">
      <div class="hero-scroll-shape border rounded-4 border-2  border-white " style="width: 25px; height: 45px;">
      </div>
      <div class="hero-scroll-dott position-absolute border rounded-4 border-0"></div>
    </div>
    </div>
</section>
